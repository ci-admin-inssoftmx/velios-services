name: Deploy Velios Servicios UAT
on:
  push:
    branches:
      - UAT
jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes
        run: nuget restore velios.Api.sln

      - name: Publicar Sitio
        shell: powershell
        run: |
          msbuild velios.Api.csproj `
            /p:DeployOnBuild=true `
            /p:PublishProfile=FolderProfile3 `
            /p:Configuration=Release `
            /verbosity:minimal

      - name: Validar Out
        shell: powershell
        run: |
          if (!(Test-Path "obj\Release\net9.0\PubTmp\Out")) {
            throw "No se encontró la carpeta Out"
          }
          Get-ChildItem "obj\Release\net9.0\PubTmp\Out" -Recurse |
            Select-Object -First 20

      - name: Crear carpetas de mantenimiento
        shell: powershell
        run: |
          New-Item -Path "maintenance" -ItemType Directory -Force
          Set-Content -Path "maintenance\app_offline.htm" -Value "<html><body><h1>Sitio en mantenimiento</h1></body></html>"
          New-Item -Path "online" -ItemType Directory -Force

      - name: Poner sitio en mantenimiento
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: maintenance/
          server-dir: /servicios/uat/
          dangerous-clean-slate: false

      - name: Deploy FTP UAT
        id: deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: obj/Release/net9.0/PubTmp/Out/
          server-dir: /servicios/uat/
          dangerous-clean-slate: false
          exclude: |
            appsettings.json

      - name: Quitar mantenimiento
        if: success()
        shell: powershell
        run: |
          $request = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/servicios/uat/app_offline.htm")
          $request.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $request.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try {
            $response = $request.GetResponse()
            $response.Close()
            Write-Host "app_offline.htm eliminado correctamente"
          } catch {
            Write-Host "No se encontró app_offline.htm o ya fue todo eliminado: $_"
          }

      - name: Mantener sitio en mantenimiento si fallo el deploy
        if: failure()
        shell: powershell
        run: |
          Write-Host "El deploy falló. El sitio permanece en mantenimiento para evitar estado inconsistente."
          Write-Host "Revisar el log y hacer push nuevamente para reintentar."
