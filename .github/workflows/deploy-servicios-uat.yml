name: Deploy Velios Servicios UAT
on:
  push:
    branches:
      - UAT
jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes
        run: nuget restore velios.Api.sln

      - name: Publicar Sitio
        shell: powershell
        run: |
          msbuild velios.Api.csproj `
            /p:DeployOnBuild=true `
            /p:PublishProfile=FolderProfile3 `
            /p:Configuration=Release `
            /verbosity:minimal

      - name: Validar Out
        shell: powershell
        run: |
          if (!(Test-Path "obj\Release\net9.0\PubTmp\Out")) {
            throw "No se encontró la carpeta Out"
          }
          Get-ChildItem "obj\Release\net9.0\PubTmp\Out" -Recurse |
            Select-Object -First 20

      - name: Crear carpeta temporal solo con app_offline.htm
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "offline-deploy" -Force
          "Sitio en mantenimiento, desplegando nueva versión..." | Out-File -FilePath "offline-deploy/app_offline.htm" -Encoding utf8

      - name: Subir app_offline.htm (detener sitio y liberar DLL)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: offline-deploy/
          server-dir: /servicios/uat/
          dangerous-clean-slate: false

      - name: Esperar liberación del proceso
        shell: powershell
        run: Start-Sleep -Seconds 8

      - name: Deploy FTP UAT
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: obj/Release/net9.0/PubTmp/Out/
          server-dir: /servicios/uat/
          dangerous-clean-slate: false

      - name: Eliminar app_offline.htm (reactivar sitio)
        shell: powershell
        run: |
          curl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" `
            "ftp://${{ secrets.FTP_SERVER }}/servicios/uat/app_offline.htm" `
            -Q "-DELE /servicios/uat/app_offline.htm"
